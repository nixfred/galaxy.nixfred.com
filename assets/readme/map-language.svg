<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">How to read NixFred Galaxy</title><desc id="d">Star size means importance, brightness means live status, color means sector, and lines mean typed relationships.</desc><rect width="1200" height="380" rx="28" fill="#060a0f"/><text x="55" y="62" fill="#edf4f8" font-family="system-ui,sans-serif" font-size="31" font-weight="650">The map is data, not decoration.</text><g font-family="system-ui,sans-serif"><g fill="#0d141c" stroke="#24313c" stroke-width="2"><rect x="55" y="105" width="250" height="205" rx="20"/><rect x="335" y="105" width="250" height="205" rx="20"/><rect x="615" y="105" width="250" height="205" rx="20"/><rect x="895" y="105" width="250" height="205" rx="20"/></g><circle cx="180" cy="174" r="32" fill="#eef6fa"/><circle cx="460" cy="174" r="24" fill="#35c98b"/><circle cx="740" cy="174" r="24" fill="#2b91bd"/><circle cx="1020" cy="174" r="20" fill="#d45a40"/><path d="M960 220h120" stroke="#d45a40" stroke-width="3"/><g fill="#eef4f8" font-size="22" font-weight="700"><text x="82" y="248">SIZE</text><text x="362" y="248">BRIGHTNESS</text><text x="642" y="248">COLOR</text><text x="922" y="248">LINES</text></g><g fill="#8fa1ad" font-size="17"><text x="82" y="278">editorial importance</text><text x="362" y="278">live or archived</text><text x="642" y="278">one of six sectors</text><text x="922" y="278">typed relationships</text></g></g><text x="600" y="350" text-anchor="middle" fill="#71838f" font-family="ui-monospace,monospace" font-size="17">Every visual signal has an explained meaning.</text></svg>
