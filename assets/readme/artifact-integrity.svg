<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d"><title id="t">Exact artifact delivery</title><desc id="d">Continuous integration validates and builds once, records a digest, deploys that exact artifact, verifies production, and can roll back.</desc><rect width="1200" height="370" rx="28" fill="#060a0f"/><text x="55" y="62" fill="#edf4f8" font-family="system-ui,sans-serif" font-size="31" font-weight="650">Build once. Prove every handoff.</text><g font-family="system-ui,sans-serif"><g fill="#0d141c" stroke="#293a44" stroke-width="2"><rect x="45" y="115" width="190" height="160" rx="18"/><rect x="275" y="115" width="190" height="160" rx="18"/><rect x="505" y="115" width="190" height="160" rx="18"/><rect x="735" y="115" width="190" height="160" rx="18"/><rect x="965" y="115" width="190" height="160" rx="18"/></g><g font-family="ui-monospace,monospace" font-size="16" font-weight="700"><text x="70" y="153" fill="#2fb8ee">VALIDATE</text><text x="300" y="153" fill="#39ce8e">BUILD</text><text x="530" y="153" fill="#d7a51e">DIGEST</text><text x="760" y="153" fill="#a780df">DEPLOY</text><text x="990" y="153" fill="#d45a40">VERIFY</text></g><g fill="#eef4f8" font-size="19" font-weight="700"><text x="70" y="198">Tests + gates</text><text x="300" y="198">One artifact</text><text x="530" y="198">SHA-256 proof</text><text x="760" y="198">Same bytes</text><text x="990" y="198">Live + rollback</text></g><g fill="#8fa1ad" font-size="16"><text x="70" y="229">zero secrets</text><text x="300" y="229">no rebuild</text><text x="530" y="229">checked again</text><text x="760" y="229">main only</text><text x="990" y="229">health checks</text></g></g><g stroke="#627783" stroke-width="3"><path d="M240 195h30M470 195h30M700 195h30M930 195h30"/></g><text x="600" y="330" text-anchor="middle" fill="#71838f" font-family="ui-monospace,monospace" font-size="17">A red push never reaches production.</text></svg>
