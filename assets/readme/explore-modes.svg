<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Four ways to explore the Galaxy</title><desc id="d">Visitors can explore the map, search through the command palette, follow guided tours, or browse the HTML Atlas.</desc><rect width="1200" height="390" rx="28" fill="#060a0f"/><text x="55" y="62" fill="#edf4f8" font-family="system-ui,sans-serif" font-size="31" font-weight="650">Choose your way through the catalog.</text><g font-family="system-ui,sans-serif"><g fill="#0d141c" stroke="#253640" stroke-width="2"><rect x="55" y="108" width="250" height="205" rx="20"/><rect x="335" y="108" width="250" height="205" rx="20"/><rect x="615" y="108" width="250" height="205" rx="20"/><rect x="895" y="108" width="250" height="205" rx="20"/></g><g font-family="ui-monospace,monospace" font-size="17" font-weight="700"><text x="82" y="151" fill="#2fb8ee">MAP</text><text x="362" y="151" fill="#39ce8e">CMD-K</text><text x="642" y="151" fill="#d7a51e">TOURS</text><text x="922" y="151" fill="#a780df">ATLAS</text></g><g fill="#eef4f8" font-size="23" font-weight="700"><text x="82" y="195">Orbit and inspect</text><text x="362" y="195">Search and jump</text><text x="642" y="195">Follow a story</text><text x="922" y="195">Browse everything</text></g><g fill="#8fa1ad" font-size="17"><text x="82" y="230">focus stars</text><text x="362" y="230">projects + modes</text><text x="642" y="230">curated paths</text><text x="922" y="230">zero WebGL required</text><text x="82" y="258">trace relations</text><text x="362" y="258">keyboard first</text><text x="642" y="258">narrated context</text><text x="922" y="258">complete HTML twin</text></g></g><text x="600" y="355" text-anchor="middle" fill="#71838f" font-family="ui-monospace,monospace" font-size="17">Different interfaces. The same complete catalog.</text></svg>
