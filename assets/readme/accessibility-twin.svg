<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">Canvas and Atlas are equal paths</title><desc id="d">The interactive Three.js Galaxy and semantic HTML Atlas share one validated graph and provide equal access to every project.</desc><rect width="1200" height="380" rx="28" fill="#060a0f"/><text x="55" y="62" fill="#edf4f8" font-family="system-ui,sans-serif" font-size="31" font-weight="650">The fallback is a first-class destination.</text><g font-family="system-ui,sans-serif"><rect x="55" y="108" width="390" height="205" rx="22" fill="#0b1820" stroke="#2fb8ee" stroke-width="2"/><rect x="755" y="108" width="390" height="205" rx="22" fill="#151120" stroke="#a780df" stroke-width="2"/><circle cx="250" cy="170" r="32" fill="#2fb8ee"/><g stroke="#2fb8ee" opacity=".6"><path d="M170 227h160"/><path d="M190 255h120"/></g><g fill="#a780df"><rect x="842" y="150" width="216" height="18" rx="5"/><rect x="842" y="184" width="170" height="14" rx="5"/><rect x="842" y="216" width="196" height="14" rx="5"/></g><g fill="#edf4f8" font-size="23" font-weight="700"><text x="175" y="292">GALAXY</text><text x="866" y="292">ATLAS</text></g><path d="M480 210h240" stroke="#eef4f8" stroke-width="3"/><path d="m705 196 15 14-15 14" fill="none" stroke="#eef4f8" stroke-width="3"/><path d="m495 196-15 14 15 14" fill="none" stroke="#eef4f8" stroke-width="3"/><text x="600" y="193" text-anchor="middle" fill="#8fa1ad" font-size="17">one validated graph</text></g><text x="600" y="350" text-anchor="middle" fill="#71838f" font-family="ui-monospace,monospace" font-size="17">keyboard · screen reader · reduced motion · no WebGL · mobile</text></svg>
